<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Name - Portfolio</title>
<meta name="description" content="Portfolio of Name - experience, projects, and skills." />
<meta name="color-scheme" content="light dark" />

<style>
/* ===================== THEME ===================== */
:root{
  --bg:#123456;
  --panel:#2b5475;
  --text:#f0f0f0;
  --muted:#c5c5c5;
  --ring:#2a4466;
  --shadow:0 10px 30px rgba(0,0,0,.25);

  /* HERO SIZE CONTROL */
  --hero-size: 36px;
}

:root.light{
  --bg:#d5f5d1;
  --panel:#eafae8;
  --text:#1f1f1f;
  --muted:#898989;
  --ring:#2a4466;
  --shadow:0 10px 30px rgba(60,80,140,.08);
}

/* ===================== BASE ===================== */
*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  padding-top:80px; /* prevents fixed header overlap */
  font:16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  background:var(--bg);
  color:var(--text);
}

@media (max-width:600px){
  body{ padding-top:96px; }
}

.container{max-width:1100px;margin:0 auto;padding:24px}
a{color:var(--text);text-decoration:none}
a:hover{text-decoration:underline}

/* ===================== BUTTONS ===================== */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 14px;border-radius:12px;
  border:1px solid var(--ring);
  background:var(--panel);
  color:var(--text);
  font-size:1rem;line-height:1.6;
}

.btn--quiet{
  background:transparent;
  border:1px solid var(--ring);
  color:var(--muted);
  padding:6px 10px;
  border-radius:10px;
}

/* ===================== HEADER ===================== */
header{
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
  background:color-mix(in oklab, var(--bg) 90%, transparent);
  border-bottom:1px solid color-mix(in oklab, var(--ring) 50%, transparent);
}

nav.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.nav-left,.nav-center,.nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.nav-center{
  margin-left:auto;
}

.brand{
  font-weight:700;
  display:flex;
  gap:10px;
}

.logo{
  width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:10px;
  border:1px solid var(--ring);
  background:var(--panel);
}

/* ===================== TOGGLE ===================== */
.toggle{
  font-weight:700;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--ring);
  background:var(--panel);
}

/* ===================== TOP ===================== */
.top{display:grid;gap:18px;padding:40px 0}

h1{
  font-size:var(--hero-size);
  line-height:1.1;
  margin:0;
}

.contact{display:flex;flex-wrap:wrap;gap:10px}

.pill{
  border:1px solid var(--ring);
  border-radius:999px;
  padding:6px 10px;
  color:var(--muted);
}

/* ===================== SECTIONS ===================== */
.section{padding:14px 0 8px;scroll-margin-top:110px}

.card{
  background:var(--panel);
  border:1px solid var(--ring);
  border-radius:16px;
  padding:16px;
}

/* ===================== TIMELINE ===================== */
.timeline{position:relative;margin:24px 0}
.timeline::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;bottom:0;
  width:2px;
  background:var(--ring);
}

.item{width:50%;padding:14px;position:relative}
.item[data-side="right"]{left:50%}

.dot{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:46px;height:46px;
  border-radius:50%;
  display:grid;place-items:center;
  background:var(--panel);
  border:2px solid var(--ring);
}

@media (max-width:900px){
  .timeline::before{left:20px}
  .item{width:100%;left:0;padding-left:56px}
  .dot{left:20px}
}

/* ===================== SKILLS ===================== */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{
  padding:6px 10px;
  border-radius:999px;
  border:1px dashed var(--ring);
  color:var(--muted);
}

/* ===================== FOOTER ===================== */
footer{text-align:center;color:var(--muted);padding:28px 0}
</style>
</head>

<body>

<header>
  <div class="container">
    <nav class="nav">
      <div class="nav-left">
        <a class="brand" href="#top"><span class="logo">Y</span>Your Name</a>
      </div>

      <div class="nav-center">
        <a class="btn" href="#experience">Experience</a>
        <a class="btn" href="#projects">Projects</a>
        <a class="btn" href="#skills">Skills</a>
        <a class="btn" href="#contact">Contact</a>
      </div>

      <div class="nav-right">
        <button id="themeToggle" class="toggle">
          <span id="themeIcon">☀️</span>
          <span id="themeLabel">Light Mode</span>
        </button>
      </div>
    </nav>
  </div>
</header>

<main id="top" class="container">

<section class="top">
  <h1>Software Engineer & Product-minded Builder</h1>
</section>

<!-- KEEP ALL YOUR ORIGINAL SECTIONS BELOW (UNCHANGED) -->
<!-- EXPERIENCE, PROJECTS, SKILLS, CONTACT -->
<!-- Your pasted content already works with this header -->

</main>

<footer>
  <div class="container">
    <small>© <span id="year"></span> Your Name</small>
  </div>
</footer>

<script>
const root=document.documentElement;
const toggleBtn=document.getElementById("themeToggle");
const icon=document.getElementById("themeIcon");
const label=document.getElementById("themeLabel");

function applyTheme(mode){
  if(mode==="dark"){
    root.classList.remove("light");
    icon.textContent="🌙";
    label.textContent="Dark Mode";
  }else{
    root.classList.add("light");
    icon.textContent="☀️";
    label.textContent="Light Mode";
  }
  localStorage.setItem("theme",mode);
}

/* LIGHT MODE DEFAULT */
applyTheme(localStorage.getItem("theme") || "light");

toggleBtn.onclick=()=>{
  applyTheme(root.classList.contains("light")?"dark":"light");
};

document.getElementById("year").textContent=new Date().getFullYear();
</script>

</body>
</html>
